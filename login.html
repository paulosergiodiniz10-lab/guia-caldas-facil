<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Guia Caldas Fácil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-gray-100">
        <div class="text-center mb-8">
            <div class="bg-[#021A3A] w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <i data-lucide="lock" class="w-8 h-8 text-[#FFC700]"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Acesso Restrito</h1>
            <p class="text-gray-500 text-sm mt-1">Painel Administrativo - Guia Caldas Fácil</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">E-mail</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="email" id="email" required placeholder="admin@guiacaldas.com" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                <div class="relative">
                    <i data-lucide="key" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
                </div>
            </div>

            <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-start gap-2 border border-red-100">
                <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
                <span id="error-text">E-mail ou senha incorretos.</span>
            </div>

            <button type="submit" id="btn-login" class="w-full bg-[#021A3A] hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2">
                Entrar no Sistema
                <i data-lucide="log-in" class="w-5 h-5"></i>
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-gray-500 hover:text-[#021A3A] flex items-center justify-center gap-1 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar para o site
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCrdkV7_A3kUdvfOEfkpYhUZgfzEhEAfM",
            authDomain: "guia-caldas-facil.firebaseapp.com",
            projectId: "guia-caldas-facil",
            storageBucket: "guia-caldas-facil.firebasestorage.app",
            messagingSenderId: "46826988375",
            appId: "1:46826988375:web:64a22b576e24c181d1d412"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');

        // Se já estiver logado, joga pro painel
        onAuthStateChanged(auth, (user) => {
            if (user) {
                try {
                    window.location.href = 'painel.html';
                } catch(e) {
                    // Tratamento para não quebrar no iframe de Preview
                    btnLogin.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Já está logado! Abra o painel.html`;
                    btnLogin.classList.replace('bg-[#021A3A]', 'bg-green-600');
                    lucide.createIcons();
                }
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btnLogin.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Entrando...`;
            btnLogin.disabled = true;
            errorMsg.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    try {
                        window.location.href = "painel.html";
                    } catch (err) {
                        btnLogin.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Logado com sucesso!`;
                        btnLogin.classList.replace('bg-[#021A3A]', 'bg-green-600');
                        lucide.createIcons();
                    }
                })
                .catch((error) => {
                    console.error(error);
                    errorMsg.classList.remove('hidden');
                    errorText.textContent = "Erro ao entrar. Verifique seu e-mail e senha.";
                    btnLogin.innerHTML = `Entrar no Sistema <i data-lucide="log-in" class="w-5 h-5"></i>`;
                    btnLogin.disabled = false;
                    lucide.createIcons();
                });
        });
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
