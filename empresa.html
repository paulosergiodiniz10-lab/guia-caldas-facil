<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Guia Caldas Fácil</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Configuração do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- Header Simples -->
    <header class="bg-[#021A3A] text-white py-3 px-4 md:px-8 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <a href="index.html" class="flex items-center gap-2 cursor-pointer">
            <i data-lucide="map-pin" class="text-[#FFC700] w-8 h-8"></i>
            <div>
                <h1 class="font-bold text-xl md:text-2xl leading-none flex gap-1">
                    GUIA <span class="text-[#FFC700]">CALDAS FÁCIL</span>
                </h1>
            </div>
        </a>
        <a href="index.html" class="flex items-center gap-2 text-white hover:text-[#FFC700] transition-colors">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <span>Voltar</span>
        </a>
    </header>

    <main class="flex-grow pb-12 relative">
        <!-- Tela de Carregamento (Loading) -->
        <div id="loading" class="absolute inset-0 bg-gray-50 z-40 flex flex-col items-center justify-center">
            <i data-lucide="loader-2" class="w-12 h-12 text-[#021A3A] animate-spin mb-4"></i>
            <p class="text-gray-600 font-medium">Buscando informações da empresa...</p>
        </div>

        <!-- Conteúdo da Empresa (Inicialmente Oculto e Vazio) -->
        <div id="company-content" class="hidden">
            <!-- Cover Header -->
            <div class="h-[300px] w-full relative">
                <img id="company-cover" src="" alt="Cover" class="w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                
                <div class="absolute -bottom-16 left-4 md:left-12 flex items-end gap-6 z-10">
                    <div class="w-32 h-32 rounded-2xl border-4 border-gray-100 overflow-hidden shadow-lg bg-white">
                        <img id="company-logo" src="" alt="Logo" class="w-full h-full object-cover" />
                    </div>
                    <div class="pb-4">
                        <span id="company-category" class="bg-[#FFC700] text-[#021A3A] text-xs font-bold px-2 py-1 rounded mb-2 inline-block">Categoria</span>
                        <h1 id="company-name" class="text-3xl md:text-4xl font-bold text-white drop-shadow-md">Nome da Empresa</h1>
                        <div class="flex items-center gap-2 text-gray-200 mt-1">
                            <i data-lucide="star" class="w-4 h-4 text-[#FFC700] fill-current"></i>
                            <span id="company-rating" class="font-bold text-white">5.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Container -->
            <div class="max-w-7xl mx-auto px-4 mt-24 grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Left Column -->
                <div class="lg:col-span-2 space-y-8">
                    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold text-[#021A3A] mb-4">Sobre a empresa</h2>
                        <p id="company-description" class="text-gray-600 leading-relaxed"></p>
                    </section>

                    <!-- Coupons Container -->
                    <section id="coupons-section" class="hidden">
                        <div class="flex items-center gap-2 mb-4">
                            <i data-lucide="percent" class="w-6 h-6 text-[#990000]"></i>
                            <h2 class="text-xl font-bold text-[#021A3A]">Cupons de Desconto</h2>
                        </div>
                        
                        <div id="coupons-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Cupons serão injetados aqui via JS -->
                        </div>
                    </section>
                </div>

                <!-- Right Column (Sidebar de Contato) -->
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <div class="flex items-start gap-3">
                            <i data-lucide="map-pin" class="w-5 h-5 text-gray-400 mt-1"></i>
                            <div>
                                <p id="company-address" class="text-sm text-gray-600">Endereço</p>
                            </div>
                        </div>
                        <hr class="border-gray-50" />
                        <div class="flex items-center gap-3">
                            <i data-lucide="clock" class="w-5 h-5 text-gray-400"></i>
                            <span id="company-status" class="text-sm font-bold text-green-600">Aberto agora</span>
                        </div>
                        <hr class="border-gray-50" />
                        
                        <a id="company-whatsapp" href="#" target="_blank" class="w-full bg-[#25D366] hover:bg-green-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
                            <i data-lucide="message-circle" class="w-5 h-5"></i>
                            Chamar no WhatsApp
                        </a>
                        
                        <div class="flex gap-2">
                            <a id="company-phone" href="#" class="flex-1 border border-gray-200 text-gray-700 hover:bg-gray-50 font-medium py-2 rounded-lg flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="phone" class="w-4 h-4"></i> Ligar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mensagem de Erro -->
        <div id="error-message" class="hidden absolute inset-0 bg-gray-50 z-40 flex flex-col items-center justify-center text-center px-4">
            <i data-lucide="alert-circle" class="w-16 h-16 text-red-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Empresa não encontrada</h2>
            <p class="text-gray-600 mb-6">A empresa que você tentou acessar não existe ou foi removida.</p>
            <a href="index.html" class="bg-[#021A3A] text-white px-6 py-2 rounded-md hover:bg-blue-900 transition-colors">Voltar para o Início</a>
        </div>
    </main>

    <!-- Scripts da aplicação -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/empresa.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
