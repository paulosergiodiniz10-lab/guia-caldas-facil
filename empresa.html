<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Guia Caldas Fácil</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Configuração do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Merriweather', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- Header Simples -->
    <header class="bg-[#021A3A] text-white py-3 px-4 md:px-8 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <a href="index.html" class="flex items-center gap-2 cursor-pointer">
            <i data-lucide="map-pin" class="text-[#FFC700] w-8 h-8"></i>
            <div>
                <h1 class="font-bold text-xl md:text-2xl leading-none flex gap-1">
                    GUIA <span class="text-[#FFC700]">CALDAS FÁCIL</span>
                </h1>
            </div>
        </a>
        <a href="index.html" class="flex items-center gap-2 text-white hover:text-[#FFC700] transition-colors">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
            <span>Voltar</span>
        </a>
    </header>

    <main class="flex-grow pb-12 relative">
        <!-- Tela de Carregamento (Loading) -->
        <div id="loading" class="absolute inset-0 bg-gray-50 z-40 flex flex-col items-center justify-center">
            <i data-lucide="loader-2" class="w-12 h-12 text-[#021A3A] animate-spin mb-4"></i>
            <p class="text-gray-600 font-medium">Buscando informações da empresa...</p>
        </div>

        <!-- Conteúdo da Empresa (Inicialmente Oculto e Vazio) -->
        <div id="company-content" class="hidden">
            <!-- Cover Header -->
            <div class="h-[300px] md:h-[400px] w-full relative">
                <img id="company-cover" src="" alt="Cover" class="w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                
                <div class="absolute -bottom-16 md:-bottom-20 left-4 md:left-12 flex items-end gap-6 z-10 w-[calc(100%-2rem)] md:w-auto">
                    <div class="w-28 h-28 md:w-40 md:h-40 rounded-2xl border-4 border-white overflow-hidden shadow-xl bg-white shrink-0">
                        <img id="company-logo" src="" alt="Logo" class="w-full h-full object-cover" />
                    </div>
                    <div class="pb-2 md:pb-4">
                        <span id="company-category" class="bg-[#FFC700] text-[#021A3A] text-[10px] md:text-xs font-bold px-2 py-1 rounded mb-1 md:mb-2 inline-block">Categoria</span>
                        <h1 id="company-name" class="text-2xl md:text-4xl font-black text-white drop-shadow-xl leading-tight mt-1 md:mt-0">Nome da Empresa</h1>
                        <div class="flex items-center gap-2 text-gray-800 mt-1 md:mt-2 bg-gray-100/90 backdrop-blur-sm px-3 py-1 rounded-full w-fit shadow-sm border border-white/20">
                            <i data-lucide="star" class="w-4 h-4 text-[#FFC700] fill-current"></i>
                            <span id="company-rating" class="font-bold">5.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Container -->
            <div class="max-w-7xl mx-auto px-4 mt-24 grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Left Column -->
                <div class="lg:col-span-2 space-y-8">
                    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold text-[#021A3A] mb-4">Sobre a empresa</h2>
                        <p id="company-description" class="text-gray-600 leading-relaxed"></p>
                    </section>

                    <!-- Coupons Container -->
                    <section id="coupons-section" class="hidden">
                        <div class="flex items-center gap-2 mb-4">
                            <i data-lucide="percent" class="w-6 h-6 text-[#990000]"></i>
                            <h2 class="text-xl font-bold text-[#021A3A]">Cupons de Desconto</h2>
                        </div>
                        
                        <div id="coupons-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Cupons serão injetados aqui via JS -->
                        </div>
                    </section>
                </div>

                <!-- Right Column (Sidebar de Contato) -->
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                        <div class="flex items-start gap-3">
                            <i data-lucide="map-pin" class="w-5 h-5 text-gray-400 mt-1"></i>
                            <div>
                                <p id="company-address" class="text-sm text-gray-600">Endereço</p>
                            </div>
                        </div>
                        <hr class="border-gray-50" />
                        <div class="flex items-center gap-3">
                            <i data-lucide="clock" class="w-5 h-5 text-gray-400"></i>
                            <span id="company-status" class="text-sm font-bold text-green-600">Aberto agora</span>
                        </div>
                        <hr class="border-gray-50" />
                        
                        <a id="company-whatsapp" href="#" target="_blank" class="w-full bg-[#25D366] hover:bg-green-600 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors">
                            <i data-lucide="message-circle" class="w-5 h-5"></i>
                            Chamar no WhatsApp
                        </a>
                        
                        <div class="flex gap-2">
                            <a id="company-phone" href="#" class="flex-1 border border-gray-200 text-gray-700 hover:bg-gray-50 font-medium py-2 rounded-lg flex items-center justify-center gap-2 transition-colors">
                                <i data-lucide="phone" class="w-4 h-4"></i> Ligar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mensagem de Erro -->
        <div id="error-message" class="hidden absolute inset-0 bg-gray-50 z-40 flex flex-col items-center justify-center text-center px-4">
            <i data-lucide="alert-circle" class="w-16 h-16 text-red-500 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Empresa não encontrada</h2>
            <p class="text-gray-600 mb-6">A empresa que você tentou acessar não existe ou foi removida.</p>
            <a href="index.html" class="bg-[#021A3A] text-white px-6 py-2 rounded-md hover:bg-blue-900 transition-colors">Voltar para o Início</a>
        </div>
    </main>

    <!-- Todo o JavaScript integrado em um só lugar -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Inicializa o Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDCrdkV7_A3kUdvfOEfkpYhUZgfzEhEAfM",
            authDomain: "guia-caldas-facil.firebaseapp.com",
            projectId: "guia-caldas-facil",
            storageBucket: "guia-caldas-facil.firebasestorage.app",
            messagingSenderId: "46826988375",
            appId: "1:46826988375:web:64a22b576e24c181d1d412"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Banco de Dados Simulado (Mock)
        const mockDatabase = {
            "piratas-pizzaria": {
                name: "Piratas Pizzaria",
                category: "Gastronomia",
                rating: "4.8",
                description: "A pizzaria mais temática e divertida de Caldas Novas! Traga sua família para uma verdadeira aventura pirata enquanto saboreia as melhores pizzas da região. Espaço kids, rodízio e à la carte.",
                address: "Av. Orcalino Santos, 123 - Centro, Caldas Novas",
                status: "Aberto agora",
                phone: "5564999999999", 
                coverUrl: "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1200&auto=format&fit=crop",
                logoUrl: "https://placehold.co/150x150/112240/facc15?text=PP",
                coupons: [
                    { title: "15% OFF no Rodízio", rules: "Válido de Terça a Quinta", code: "PIRATA15" },
                    { title: "Sobremesa Grátis", rules: "Na compra de 1 Pizza G", code: "DOCEPIRATA" }
                ]
            },
            "aurion-energy": {
                name: "Aurion Energy",
                category: "Serviços",
                rating: "5.0",
                description: "Energia Solar por Assinatura. Economize até 25% na sua conta de luz sem investir nada em painéis solares. Nós geramos a energia e você recebe o desconto direto na conta da Enel.",
                address: "Atendimento Digital - Caldas Novas",
                status: "Atendimento 24h (Online)",
                phone: "5564988888888",
                coverUrl: "https://images.unsplash.com/photo-1509391366360-1288cfa69f37?q=80&w=1200&auto=format&fit=crop",
                logoUrl: "https://placehold.co/150x150/0b284e/ffffff?text=AE",
                coupons: []
            },
            "diroma-acqua-park": {
                name: "diRoma Acqua Park",
                category: "Lazer",
                rating: "4.9",
                description: "Diversão garantida para toda a família com as melhores piscinas de águas quentes de Caldas Novas.",
                address: "R. São Cristóvão, 1110 - Solar de Caldas",
                status: "Aberto agora",
                phone: "556434531586",
                coverUrl: "https://images.unsplash.com/photo-1582298538104-efa9ca148386?q=80&w=1200&auto=format&fit=crop",
                logoUrl: "https://placehold.co/150x150/0ea5e9/ffffff?text=DR",
                coupons: []
            }
        };

        // Função principal que carrega os dados
        async function loadCompanyData() {
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('id');

            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('company-content');
            const errorDiv = document.getElementById('error-message');

            if (!companyId) {
                loadingDiv.classList.add('hidden');
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                // Simula um tempo rápido de carregamento
                await new Promise(resolve => setTimeout(resolve, 800)); 
                
                const companyData = mockDatabase[companyId];

                if (!companyData) {
                    throw new Error("Empresa não encontrada.");
                }

                // Injetando textos
                document.getElementById('company-name').textContent = companyData.name;
                document.getElementById('company-category').textContent = companyData.category;
                document.getElementById('company-rating').textContent = companyData.rating;
                document.getElementById('company-description').textContent = companyData.description;
                document.getElementById('company-address').textContent = companyData.address;
                document.getElementById('company-status').textContent = companyData.status;
                
                // Injetando imagens
                document.getElementById('company-cover').src = companyData.coverUrl;
                document.getElementById('company-logo').src = companyData.logoUrl;

                // Injetando links
                document.getElementById('company-whatsapp').href = `https://wa.me/${companyData.phone}`;
                document.getElementById('company-phone').href = `tel:+${companyData.phone}`;
                document.title = `${companyData.name} - Guia Caldas Fácil`;

                // Injetando cupons (se houver)
                if (companyData.coupons && companyData.coupons.length > 0) {
                    document.getElementById('coupons-section').classList.remove('hidden');
                    const couponsList = document.getElementById('coupons-list');
                    
                    companyData.coupons.forEach(coupon => {
                        const couponHTML = `
                            <div class="bg-gradient-to-r from-red-50 to-white border border-red-100 p-4 rounded-xl flex items-center justify-between shadow-sm relative overflow-hidden">
                                <div class="absolute -right-4 -top-4 text-red-50 opacity-50">
                                    <i data-lucide="percent" class="w-24 h-24"></i>
                                </div>
                                <div class="relative z-10">
                                    <h4 class="font-bold text-red-700 text-lg">${coupon.title}</h4>
                                    <p class="text-xs text-gray-500 mb-2">${coupon.rules}</p>
                                    <div class="inline-block bg-white border-2 border-dashed border-red-200 text-red-600 font-mono font-bold py-1 px-3 rounded">
                                        ${coupon.code}
                                    </div>
                                </div>
                            </div>
                        `;
                        couponsList.insertAdjacentHTML('beforeend', couponHTML);
                    });
                }

                // Troca as telas
                loadingDiv.classList.add('hidden');
                contentDiv.classList.remove('hidden');
                lucide.createIcons(); // Recarrega ícones novos

            } catch (error) {
                console.error("Erro ao carregar:", error);
                loadingDiv.classList.add('hidden');
                errorDiv.classList.remove('hidden');
            }
        }

        // Executa a função quando a página carregar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadCompanyData);
        } else {
            loadCompanyData();
        }
    </script>

    <!-- Ativação dos ícones iniciais -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
